name: Build/test package and publish to PyPI if is a tag

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build, test, and package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Fortran toolchain (Linux/macOS)
        if: runner.os != 'Windows'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc

      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-winpthreads
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
          path-type: inherit

      - name: Set up CMake (Linux/Windows)
        if: runner.os != 'macOS'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.31.6'

      - name: Set up CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install Python build and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user build wheel pytest numpy

      - name: Run CTest (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p build
          cmake -S . -B build
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Run CTest (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p build
          cmake -S . -B build -G "MinGW Makefiles"
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Build Python wheel package (non-Windows)
        if: runner.os != 'Windows'
        run: python -m build --wheel

      - name: Build Python wheel package (Windows - MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python -m build --wheel

      - name: Install package wheel and run pytest (non-Windows)
        if: runner.os != 'Windows'
        run: |
          python -m pip install dist/*.whl
          python -m pytest test --maxfail=1 -q

      - name: Install package wheel and run pytest (Windows - MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python -m pip install dist/*.whl
          python -m pytest test --maxfail=1 -q

      - name: Store distribution packages
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/miescat/
    permissions:
      id-token: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: python-package-distributions-*
          path: dist/
          merge-multiple: true

      - name: List files to verify
        run: ls -R dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
