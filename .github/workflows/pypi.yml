#
# pypi.yml – triggered on pushing a version tag (e.g. v0.2.3).
#
# Rebuilds all wheels fresh (does not reuse staging artifacts, so the exact
# commit that is tagged is what ends up on PyPI), then publishes to PyPI via
# OIDC trusted publishing – no API token or secret needed.
#
# One-time setup required on pypi.org:
#   Account → Publishing → Add a new pending publisher
#     Owner:    alberto743
#     Repo:     miev0-wrapper
#     Workflow: pypi.yml
#     Environment: pypi

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  reuse-lint:
    name: REUSE compliance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: fsfe/reuse-action@v4

  build_sdist:
    name: Build source distribution
    needs:
      - reuse-lint
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build sdist
        run: |
          pip install --upgrade pip build
          python -m build --sdist --outdir dist/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs:
      - build_sdist
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v4.0.0

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs:
      - build_wheels
      - build_sdist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/miescat/
    permissions:
      id-token: write

    steps:
      - name: Download wheels (all platforms)
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
