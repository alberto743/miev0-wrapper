#
# staging.yml – triggered on every push to the `master` branch.
#
# Builds *all* binary wheels with cibuildwheel (full matrix of Python
# versions and platforms) and runs the embedded test suite inside each wheel.
# Wheels are uploaded as artifacts for inspection but are NOT published.
# This acts as the final quality gate before a release tag is pushed.

name: Staging - build wheels (no publish)

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  reuse-lint:
    name: REUSE compliance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: fsfe/reuse-action@v6

  build_wheels:
    name: Build wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs:
      - reuse-lint
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v4.0.0

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 7

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-slim
    needs:
      - reuse-lint

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build sdist
        run: |
          pip install --upgrade pip build
          python -m build --sdist --outdir dist/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7
